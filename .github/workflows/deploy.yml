name: Deploy

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, curl, dom, fileinfo, pcntl, tokenizer, ctype, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Tests
        run: php artisan test

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sepehrdev.dev

    steps:
      # Connect to the production server over SSH and deploy
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1 
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/nexashop
            git pull --ff-only origin main
            docker compose -f compose.prod.yml build
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f compose.prod.yml exec -T app php artisan optimize
            curl --fail --silent --show-error https://sepehrdev.dev/up
